# ============================================================
# Nginx config untuk ActiVibe — 3 portal (Volunteer/Organizer/Admin)
# Semua portal berjalan di satu container, port berbeda
# ============================================================

# ── Portal Volunteer (port 5173) ──────────────────────────
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/volunteer;
    index index.html;

    # SPA fallback: semua route diarahkan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API ke backend (hindari CORS di production)
    location ~ ^/(auth|profile|events|applications|organizations|sub-organizers|recommendations|locations|passport|organizer|subscriptions|communication|certificates|uploads)/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Penting: forward cookie untuk JWT httpOnly
        proxy_pass_header  Set-Cookie;
        proxy_cookie_path  / /;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # Cache assets statis
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

